[package]
name = "ai-id-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Host tools for the AI identity engine: privacy-preserving HWID, offline activation, TPM/software attestation and AI Birth Certificates"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hwid"
path = "src/bin/hwid.rs"

[[bin]]
name = "aiid"
path = "src/bin/aiid.rs"

[dependencies]
ai-id-verifier = { path = "../verifier" }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
