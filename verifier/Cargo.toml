[package]
name = "ai-id-verifier"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Reference verifier for AI identity engine attestation quotes (ECDSA P-256, DICE-style key chain)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ai-id-verifier"
path = "src/main.rs"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
