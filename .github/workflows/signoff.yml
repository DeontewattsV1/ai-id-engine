# .github/workflows/signoff.yml
name: signoff
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y verilator yosys sby libssl-dev
      - run: make lint
      - run: make sim
      - run: make fuzz
      - run: make formal
      - run: make cov && python3 test/cov_gate.py --min 95
