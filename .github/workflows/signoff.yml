# Legacy full-chip signoff. BLOCKED: formal, fuzz and coverage gates depend on
# files that do not exist yet (see docs/REMEDIATION.md), so this runs only on
# demand and is expected to fail at `make fuzz` until that work lands.
# The operational gates run in ci.yml on every push and pull request.
name: signoff (blocked, manual)
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Yosys and SymbiYosys from OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator libssl-dev
      - name: Validate toolchain
        run: |
          verilator --version
          yosys -V
          sby --version
      - run: make lint
      - run: make sim
      - run: make fuzz
      - run: make formal
      - run: make cov && python3 test/cov_gate.py --min 95
