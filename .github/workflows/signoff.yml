# Legacy signoff pipeline. Despite the name this is NOT a tapeout signoff:
# `formal` proves gf_mult only, `cov` checks for non-empty coverage, and
# `fuzz` is the PUF harness unit test plus an exhaustive gf_mult sim.
# See docs/OPERATIONAL.md for what each gate does and does not establish.
name: signoff
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Yosys and SymbiYosys from OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Validate toolchain
        run: |
          verilator --version
          yosys -V
          sby --version
      - run: make lint
      - run: make sim
      - run: make fuzz
      - run: make formal
      - run: make cov
