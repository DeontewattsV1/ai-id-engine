name: signoff
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Yosys and SymbiYosys from OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator libssl-dev
      - name: Validate toolchain
        run: |
          verilator --version
          yosys -V
          sby --version
      - run: make lint
      - run: make sim
      - run: make fuzz
      - run: make formal
      - run: make cov && python3 test/cov_gate.py coverage.dat
