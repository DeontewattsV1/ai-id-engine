# Operational gates for v0.1.0. See docs/OPERATIONAL.md.
# Functional gates only; NOT a security or tapeout signoff (see LIMITATIONS.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  OSS_CAD_SUITE_VERSION: "2026-11-15"
jobs:
  rtl:
    name: RTL lint + full-chip simulation + unit KATs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev python3-numpy
      - run: verilator --version && iverilog -V | head -1
      - name: Lint (hardware, simulation and fuse-UDS builds + bridges, -Wall, zero warnings)
        run: make lint
      - name: End-to-end id_engine_top simulation checked against OpenSSL
        run: make sim
      - name: Unit RTL known-answer tests
        run: make rtl-unit
      - name: Firmware/RTL register ABI agreement
        run: make regmap
      - name: Known-answer tests (NIST SHA-256, RFC 4231 HMAC, RFC 6979 ECDSA P-256)
        run: make kat
      - name: Masked Montgomery RTL (v2 2-share, 3-share, wrapper) + TVLA statistics unit tests
        run: make tvla-test
      - name: Coded fault detection (bit-flip injection; pcr_bank + full chip with AI_ID_FAULT_DETECT)
        run: make fault-test
      - name: Formal (gf_mult, OTP fuse semantics, PCR extend-only)
        run: make formal-all
      - name: Formal, fault detection (fault alarm, key store, key non-interference, PCR controller codes)
        timeout-minutes: 60
        run: make formal-fd

  tvla:
    name: TVLA (sky130 gate-level, profile ci, 4000 traces/group, gate 4.37)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y python3-numpy
      - name: Power-model cross-check (in-sim energies == waveform-derived energies)
        run: make tvla-xcheck
      - name: TVLA on mont_mul_masked_v2 (null control first; verdict reported, harness failure fails CI)
        run: |
          set +e
          make tvla PROFILE=ci MASKED=masked_v2 TV=build/tvla
          rc=$(cat build/tvla/gate.rc 2>/dev/null || echo 99)
          echo "gate exit $rc"
          {
            echo "### TVLA, profile ci (simulated gate-level traces, not silicon)"
            echo '```'
            cat build/tvla/summary.txt
            echo '```'
            echo "> CI is not signoff: 4000 traces/group resolves leaks above ~0.1 sigma."
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 pass, 2/3/4 are leakage/area VERDICTS (reported); 5 = harness failure.
          case $rc in 0|2|3|4) exit 0 ;; *) exit 1 ;; esac
      - name: RTL -> sky130 netlist equivalence (mont_mul; known proof gaps in config/equiv_known.txt)
        run: make equiv
      - name: Signed evidence report over the TVLA run (software root in CI)
        run: make evidence PROFILE=ci MASKED=masked_v2 TV=build/tvla ATTEST=software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvla-ci-evidence
          path: |
            build/tvla/*.json
            build/tvla/summary.txt
            build/area_*.txt
            build/equiv/equiv_mont_mul.txt

  verifier:
    name: Rust quote verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v5
      - run: cargo --version
      - name: Build and test (warnings are errors)
        run: cargo test --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: CLI demo (issue, verify, reject tampered and replayed quotes)
        run: cargo run --locked -q -- demo --out "$RUNNER_TEMP/demo"

  hwid:
    name: hwid + aiid (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hwid
        shell: bash
    steps:
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
      # The repo root has legacy paths that are invalid on Windows (e.g. a
      # directory name ending in a space), so git checkout fails there; fetch
      # only the two crates from the commit tarball instead.
      - name: Fetch hwid + verifier sources (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}" -o src.tgz
          tar xzf src.tgz --wildcards --strip-components=1 '*/hwid/*' '*/verifier/*'
          ls hwid verifier
      - run: cargo --version
      - name: Test (warnings are errors)
        run: cargo test --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Smoke test the CLIs
        run: |
          cargo build --locked -q
          ./target/debug/hwid show
          ./target/debug/hwid challenge
          ./target/debug/hwid attest --mode software --nonce 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff --out "$RUNNER_TEMP/att.json"
          ./target/debug/hwid verify-attest --in "$RUNNER_TEMP/att.json" --nonce 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          mkdir -p "$RUNNER_TEMP/m" && head -c 100000 /dev/urandom > "$RUNNER_TEMP/m/model.safetensors"
          ./target/debug/aiid ca init --dir "$RUNNER_TEMP/ca"
          ./target/debug/aiid cert create --weights "$RUNNER_TEMP/m" --ca "$RUNNER_TEMP/ca" --attest software --out "$RUNNER_TEMP/c.json" --svg "$RUNNER_TEMP/c.svg"
          ./target/debug/aiid cert verify --cert "$RUNNER_TEMP/c.json" --ca "$RUNNER_TEMP/ca" --weights "$RUNNER_TEMP/m" --this-machine

  tpm:
    name: TPM 2.0 attestation against swtpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools tpm2-tools
      - name: Start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/tpm"
          swtpm socket --tpm2 --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
            --tpmstate dir="$RUNNER_TEMP/tpm" --flags not-need-init,startup-clear --daemon
          sleep 1
          TPM2TOOLS_TCTI=swtpm:port=2321 tpm2_getcap properties-fixed | head -5
      - name: Quote, verify, and certify with the TPM path
        env:
          TPM2TOOLS_TCTI: swtpm:port=2321
        working-directory: hwid
        run: |
          cargo build --locked -q
          N=$(openssl rand -hex 32)
          ./target/debug/hwid attest --mode tpm --nonce $N --out "$RUNNER_TEMP/tpm.json"
          ./target/debug/hwid verify-attest --in "$RUNNER_TEMP/tpm.json" --nonce $N | tee "$RUNNER_TEMP/v.txt"
          grep -q "SIMULATED swtpm" "$RUNNER_TEMP/v.txt"
          if ./target/debug/hwid verify-attest --in "$RUNNER_TEMP/tpm.json" --nonce $(openssl rand -hex 32); then exit 1; fi
          mkdir -p "$RUNNER_TEMP/m" && head -c 100000 /dev/urandom > "$RUNNER_TEMP/m/model.bin"
          ./target/debug/aiid ca init --dir "$RUNNER_TEMP/ca"
          ./target/debug/aiid cert create --weights "$RUNNER_TEMP/m" --ca "$RUNNER_TEMP/ca" --attest tpm --out "$RUNNER_TEMP/c.json"
          ./target/debug/aiid cert verify --cert "$RUNNER_TEMP/c.json" --ca "$RUNNER_TEMP/ca" --weights "$RUNNER_TEMP/m"
          # a simulated TPM must not satisfy --require-tpm
          if ./target/debug/aiid cert verify --cert "$RUNNER_TEMP/c.json" --ca "$RUNNER_TEMP/ca" --require-tpm; then exit 1; fi

  demo:
    name: make demo (RTL quote -> verifier -> birth certificate on bert-tiny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-out
          path: |
            demo-out/*.json
            demo-out/*.svg
            demo-out/rtl_sim.log

  fpga:
    name: FPGA synth + place & route (ULX3S ECP5-85F)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
      - run: make -C fpga
      - uses: actions/upload-artifact@v4
        with:
          name: fpga-reports
          path: |
            fpga/build/summary.txt
            fpga/build/utilization_ecp5.txt
            fpga/build/nextpnr.log
            fpga/build/nextpnr_report.json

  repro:
    name: Reproducible bitstream (two clean REPRO=1 builds, identical digests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
      - name: Build A
        run: make -C fpga repro B=build_a
      - name: Build B (fresh directory)
        run: make -C fpga repro B=build_b
      - name: A and B must be bit-identical
        run: diff -u fpga/build_a/digests.txt fpga/build_b/digests.txt
      - name: Compare with committed expectations (fpga/repro.sha256, fpga/toolchain.lock)
        run: |
          make -C fpga repro-check B=build_a
          {
            echo "### Reproducible bitstream (REPRO=1, public test UDS)"
            echo '```'
            cat fpga/build_a/digests.txt fpga/build_a/toolchain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-digests
          path: |
            fpga/build_a/digests.txt
            fpga/build_a/toolchain.txt
            fpga/build_b/digests.txt

  driver:
    name: Linux driver core builds against kernel headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kernel headers
        run: sudo apt-get update && sudo apt-get install -y "linux-headers-$(uname -r)"
      - name: Build fw/id_engine.ko
        run: make -C fw
