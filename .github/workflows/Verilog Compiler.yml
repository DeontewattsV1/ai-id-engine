# Original invalid placeholder step has been replaced by an executable lint gate.
name: Verilog Compiler
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-11-15"
          github-token: ${{ github.token }}
      - run: make lint
